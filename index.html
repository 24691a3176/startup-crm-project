<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Startup CRM Lite</title>
    <meta name="description" content="A lightweight CRM for startups to manage leads, track pipelines, and analyze sales performance." />
    <script>
      // Apply saved theme BEFORE any render to prevent flash of wrong theme
      (function() {
        try {
          var theme = localStorage.getItem('crm_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
